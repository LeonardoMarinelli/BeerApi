name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore BeerApi.slnx

      - name: Build
        run: dotnet build BeerApi.slnx --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test tests/BeerApi.UnitTests --configuration Release --no-build