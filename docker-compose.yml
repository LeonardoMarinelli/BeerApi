services:
  db:
    image: mysql:8.0
    container_name: beerapi_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-beerapi}
      MYSQL_USER: ${MYSQL_USER:-beerapi_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-beerapi_pass}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - beerapi_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=${MYSQL_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: beerapi_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - beerapi_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: beerapi_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: src/BeerApi.Api/Dockerfile
    container_name: beerapi_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      DB_HOST: db
      DB_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-beerapi}
      MYSQL_USER: ${MYSQL_USER:-beerapi_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-beerapi_pass}
      REDIS_CONNECTION: redis:6379
      Cache__Enabled: ${CACHE_ENABLED:-true}
      App__PublicBaseUrl: ${APP_PUBLIC_BASE_URL:-http://localhost:5157}
      Smtp__Host: mailpit
      Smtp__Port: 1025
      Smtp__FromAddress: no-reply@beerapi.local
      AdminUser__Email: ${AdminUser__Email:-admin@beerapi.com}
      AdminUser__Password: ${AdminUser__Password:-Admin@123!}
    ports:
      - "5157:8080"

  k6:
    image: grafana/k6:0.55.0
    profiles: ["loadtest"]
    depends_on:
      api:
        condition: service_started
    environment:
      BASE_URL: http://api:8080
      ADMIN_EMAIL: ${AdminUser__Email:-admin@beerapi.com}
      ADMIN_PASSWORD: ${AdminUser__Password:-Admin@123!}
    volumes:
      - ./loadtests/k6:/scripts:ro
    command: ["run", "/scripts/read-heavy.js"]

volumes:
  beerapi_mysql_data:
    driver: local
  beerapi_redis_data:
    driver: local
